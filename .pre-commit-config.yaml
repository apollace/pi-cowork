repos:
  # Python lint + format (replaces flake8, black, isort, bandit)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # JavaScript lint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.21.0
    hooks:
      - id: eslint
        files: ^static/.*\.js$
        additional_dependencies:
          - "eslint@9.21.0"
          - "@eslint/js@9.21.0"
          - "globals@15.15.0"

  # Cross-language duplication detector
  - repo: https://github.com/kucherenko/jscpd-precommit
    rev: v3.5.10
    hooks:
      - id: jscpd
        args: [--config, .jscpd.json]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
